    - generic [ref=f111e121]:
      - heading "What your BMR means" [level=2] [ref=f111e122]
      - paragraph [ref=f111e123]: Your Basal Metabolic Rate is the energy your body needs to keep its core systems running while at complete rest — the heart beating, the lungs breathing, cells repairing, and body temperature steady. It is the largest single component of the calories you burn each day.
      - heading "From BMR to daily calories (maintenance calorie calculator)" [level=2] [ref=f111e124]
      - paragraph [ref=f111e125]:
        - text: Nobody spends all day at rest. To estimate your real daily needs, your BMR is multiplied by an activity factor to produce your
        - link "Total Daily Energy Expenditure (TDEE)" [ref=f111e126] [cursor=pointer]:
          - /url: /tdee-calculator/
        - text: — your maintenance calorie target. From there, you can create a
        - link "calorie deficit" [ref=f111e127] [cursor=pointer]:
          - /url: /guides/calorie-deficit-guide/
        - text: to lose weight or a surplus to gain it. Use the full
        - link "online calorie calculator" [ref=f111e128] [cursor=pointer]:
          - /url: /
        - text: to get goal-based targets and macros.
      - heading "The Mifflin-St Jeor equation" [level=2] [ref=f111e129]
      - paragraph [ref=f111e130]:
        - text: "For men: BMR = 10 × weight(kg) + 6.25 × height(cm) − 5 × age + 5. For women: the same formula ending in − 161. Research has found it to be more accurate for most people than the older Harris-Benedict equation. For your complete maintenance calorie calculator needs, use our"
        - link "maintenance calorie calculator guide" [ref=f111e131] [cursor=pointer]:
          - /url: /guides/maintenance-calorie-calculator/
        - text: .
