    - generic [ref=e81]:
      - heading "Complete nutrition database" [level=2] [ref=e82]
      - paragraph [ref=e83]: Our food search taps into the USDA FoodData Central database with over 300,000 foods. As you type, suggestions appear instantly from common foods like fruits, vegetables, meats, grains, and snacks. The autocomplete makes it easy to find what you're looking for — no need to spell perfectly or know exact names.
      - heading "Macronutrient breakdown" [level=2] [ref=e84]
      - paragraph [ref=e85]:
        - text: Every search returns calories, protein, carbohydrates, fat, saturated fat, trans fat (when available), fiber, sugar, sodium, potassium, and cholesterol. This helps you track macros for muscle building, fat loss, or maintenance — whichever your goal. Pair this with your
        - link "daily calorie target" [ref=e86] [cursor=pointer]:
          - /url: /
        - text: to stay on plan.
      - heading "Vitamins & minerals tracked" [level=2] [ref=e87]
      - paragraph [ref=e88]: Vitamins C and A, vitamin D, vitamin K, B6 and B12, folate, thiamin, riboflavin, niacin, calcium, iron, magnesium, phosphorus, zinc, copper, manganese, and selenium appear when available. These micronutrients matter for energy, immune function, bone health, and recovery from training.
      - heading "What are calories?" [level=2] [ref=e89]
      - paragraph [ref=e90]:
        - text: A calorie is a unit of energy. When we talk about food, "calories" measure how much energy a food provides to your body. Your body uses that energy for everything from breathing and thinking to walking and exercising. Eat about as many calories as you burn and your weight stays stable; eat more or fewer and you gain or lose weight over time. To find how many calories
        - emphasis [ref=e91]: you
        - text: need each day, use our
        - link "calorie calculator" [ref=e92] [cursor=pointer]:
          - /url: /
        - text: .
      - heading "Understanding protein, carbs, and fats" [level=2] [ref=e93]
      - paragraph [ref=e94]: "Calories come from three macronutrients, each with a different energy density:"
      - list [ref=e95]:
        - listitem [ref=e96]:
          - strong [ref=e97]: "Protein (4 calories per gram):"
          - text: builds and repairs muscle and keeps you full. Found in meat, fish, eggs, dairy, beans, and tofu.
        - listitem [ref=e98]:
          - strong [ref=e99]: "Carbohydrates (4 calories per gram):"
          - text: your body's main fuel. Found in grains, fruit, vegetables, and sugar.
        - listitem [ref=e100]:
          - strong [ref=e101]: "Fat (9 calories per gram):"
          - text: the most calorie-dense macro; essential for hormones and absorbing vitamins. Found in oils, nuts, dairy, and meat.
      - paragraph [ref=e102]:
        - text: This is why a tablespoon of oil has more calories than a whole apple — fat packs more than double the energy per gram. Use the
        - link "macro calculator" [ref=e103] [cursor=pointer]:
          - /url: /macro-calculator/
        - text: to split your daily calories into grams of each.
      - heading "How calorie tracking works" [level=2] [ref=e104]
      - paragraph [ref=e105]:
        - text: "Tracking is simple: look up each food you eat, enter how much you had, and add up the calories across the day. Compare that total to your target — your maintenance level (your"
        - link "TDEE" [ref=e106] [cursor=pointer]:
          - /url: /tdee-calculator/
        - text: ) to stay the same, below it for a
        - link "calorie deficit" [ref=e107] [cursor=pointer]:
          - /url: /guides/calorie-deficit-guide/
        - text: to lose weight, or above it to gain. Tracking even loosely for a week or two reveals where your calories actually come from, which is often surprising.
      - heading "Food portion conversions" [level=2] [ref=e108]
      - paragraph [ref=e109]: "Nutrition data is usually listed per 100 grams, but you rarely eat exactly 100 g. This tool converts common units for you. As a rough guide:"
      - list [ref=e110]:
        - listitem [ref=e111]: 1 ounce (oz) ≈ 28 g
        - listitem [ref=e112]: 1 pound (lb) ≈ 454 g
        - listitem [ref=e113]: 1 cup ≈ 240 g (for water-like liquids)
        - listitem [ref=e114]: 1 tablespoon ≈ 15 g · 1 teaspoon ≈ 5 g
      - paragraph [ref=e115]: Volume-to-weight conversions (cups, spoons, ml) assume a density close to water, so they're most accurate for liquids and approximate for solids. For the most precise tracking, weigh foods in grams.
      - heading "Weight gain and weight loss basics" [level=2] [ref=e116]
      - paragraph [ref=e117]:
        - text: Both come down to energy balance. A pound of body fat stores about 3,500 calories, so a daily deficit of ~500 calories produces roughly one pound of fat loss per week — and a similar surplus supports lean weight gain when paired with training. Knowing the calories in your food is half the equation; knowing your target is the other half. Find your number with the
        - link "calorie calculator" [ref=e118] [cursor=pointer]:
          - /url: /
        - text: or check your maintenance level with the
        - link "TDEE calculator" [ref=e119] [cursor=pointer]:
          - /url: /tdee-calculator/
        - text: ", then use this food search to stay on track."
