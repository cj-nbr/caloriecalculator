    - generic [ref=f99e352]:
      - heading "The free online calorie calculator that does the math for you" [level=2] [ref=f99e353]
      - paragraph [ref=f99e354]:
        - text: Our
        - strong [ref=f99e355]: calorie calculator
        - text: is a fast, accurate, and completely
        - strong [ref=f99e356]: free
        - text: tool — an
        - strong [ref=f99e357]: online calorie calculator
        - text: that tells you exactly how many calories to eat each day to reach your goal — whether that's losing fat, gaining weight, or maintaining where you are. Instead of guessing, you get a personalized
        - strong [ref=f99e358]: daily calorie calculator
        - text: result in seconds, backed by the same science-based formulas used by dietitians and researchers worldwide.
      - heading "How the calorie calculator works" [level=3] [ref=f99e359]
      - paragraph [ref=f99e360]:
        - text: The number of calories you need each day depends on your age, sex, height, weight, and activity level. Your body burns a baseline amount just to stay alive — your
        - link "Basal Metabolic Rate (BMR)" [ref=f99e361] [cursor=pointer]:
          - /url: /bmr-calculator/
        - text: — and burns more on top of that through movement and exercise. Add them together and you get your
        - link "Total Daily Energy Expenditure (TDEE)" [ref=f99e362] [cursor=pointer]:
          - /url: /tdee-calculator/
        - text: . Our built-in
        - strong [ref=f99e363]: TDEE calculator
        - text: handles this automatically using the trusted Mifflin-St Jeor equation, so your
        - strong [ref=f99e364]: maintenance calorie calculator
        - text: number is as accurate as a simple formula can get.
      - heading "Calorie calculator for weight loss and weight gain" [level=3] [ref=f99e365]
      - paragraph [ref=f99e366]:
        - text: Once you know your maintenance calories, reaching any goal becomes simple math. To lose weight, you eat fewer calories than you burn — a
        - link "calorie deficit" [ref=f99e367] [cursor=pointer]:
          - /url: /guides/calorie-deficit-guide/
        - text: . Our
        - strong [ref=f99e368]: calorie deficit calculator
        - text: shows you the daily target for a gentle, steady, or aggressive pace, so you always know how many calories you should eat to lose weight safely. A deficit of about 500 calories per day produces roughly one pound of fat loss per week, since a pound of body fat stores about 3,500 calories. Want to build muscle instead? Use the
        - strong [ref=f99e369]: calorie calculator to gain weight
        - text: by selecting a weight-gain goal, which adds a controlled surplus on top of your TDEE. If you're tracking a specific target, the
        - link "weight loss calculator" [ref=f99e370] [cursor=pointer]:
          - /url: /weight-loss-calculator/
        - text: estimates how long it will take to reach your goal weight.
      - heading "From calories to food and macros" [level=3] [ref=f99e371]
      - paragraph [ref=f99e372]:
        - text: Every result from this
        - strong [ref=f99e373]: free food calorie calculator
        - text: also splits your daily total into grams of protein, carbohydrates, and fat with our
        - link "macro calculator" [ref=f99e374] [cursor=pointer]:
          - /url: /macro-calculator/
        - text: . Whether you're logging a home recipe, a restaurant meal, or a quick snack, you can match the calories of your food against your personalized budget. Protein provides 4 calories per gram — use our
        - link "protein calculator" [ref=f99e375] [cursor=pointer]:
          - /url: /protein-calculator/
        - text: to hit your daily protein target.
      - paragraph [ref=f99e376]:
        - text: Pair it with the
        - link "protein calculator" [ref=f99e377] [cursor=pointer]:
          - /url: /protein-calculator/
        - text: to make sure you're eating enough protein to preserve muscle while you lose fat or build it while you gain. Learn all about
        - link "protein calories" [ref=f99e378] [cursor=pointer]:
          - /url: /guides/protein-calories/
        - text: and the
        - link "macro guide" [ref=f99e379] [cursor=pointer]:
          - /url: /guides/macro-guide/
        - text: for complete nutrition tracking.
      - heading "Your daily food calorie calculator and tracker" [level=3] [ref=f99e380]
      - paragraph [ref=f99e381]:
        - text: Think of this as your everyday
        - strong [ref=f99e382]: online calorie calculator
        - text: — a fast, app-like
        - strong [ref=f99e383]: food calorie calculator
        - text: "you can return to any time you need to check your numbers. There's nothing to download: it works instantly in your browser on phone, tablet, or desktop, which makes it a practical free alternative to a paid"
        - strong [ref=f99e384]: food calorie calculator app
        - text: . Your most recent results are saved on your own device so you can pick up where you left off, and you can copy, print, or share your results with a single tap. Because your calorie needs change as your body changes, it's smart to revisit the calculator every few weeks — recalculating after every 4–5 kg (about 10 lb) of weight change keeps your daily target accurate and your progress steady.
      - heading "Why choose our calorie calculator?" [level=3] [ref=f99e385]
      - list [ref=f99e386]:
        - listitem [ref=f99e387]:
          - strong [ref=f99e388]: Calorie calculator free
          - text: — every tool here is 100% free, with no sign-up, no paywall, and no limits.
        - listitem [ref=f99e389]:
